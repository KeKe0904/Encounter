<th:block th:fragment="panel" th:with="primaryMenu=${menuFinder.getPrimary()}">
  <div class="menu-modal" th:if="${primaryMenu != null and not #lists.isEmpty(primaryMenu.menuItems)}"
       data-menu-modal hidden>
    <div class="menu-modal__layer" data-menu-close></div>
    <div class="menu-modal__panel" role="dialog" aria-modal="true" aria-label="站内导航">
      <ul class="menu-list">
        <li class="menu-item" th:each="menuItem : ${primaryMenu.menuItems}">
          <a class="menu-link"
             th:href="@{${menuItem.status.href}}"
             th:text="${menuItem.status.displayName}"
             th:target="${menuItem.spec.target?.value}"></a>
          <ul class="menu-sublist" th:if="${not #lists.isEmpty(menuItem.children)}">
            <li class="menu-subitem" th:each="child : ${menuItem.children}">
              <a class="menu-link menu-sublink"
                 th:href="@{${child.status.href}}"
                 th:text="${child.status.displayName}"
                 th:target="${child.spec.target?.value}"></a>
            </li>
          </ul>
        </li>
      </ul>
      <div class="menu-hint">↑ ↓ 选择 · ↵ 进入 · ESC 关闭</div>
    </div>
  </div>
</th:block>
