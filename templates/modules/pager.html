<nav th:fragment="pager(hasPrev, prevUrl, hasNext, nextUrl)" class="encounter-pager"
     th:if="${(hasPrev != null and hasPrev) or (hasNext != null and hasNext)}">
  <a th:if="${hasPrev}" th:href="${prevUrl}" class="pager-prev" rel="prev" aria-label="上一页">&larr; 上一页</a>
  <span th:unless="${hasPrev}" class="pager-prev is-disabled" aria-disabled="true">&larr; 上一页</span>

  <a th:if="${hasNext}" th:href="${nextUrl}" class="pager-next" rel="next" aria-label="下一页">下一页 &rarr;</a>
  <span th:unless="${hasNext}" class="pager-next is-disabled" aria-disabled="true">下一页 &rarr;</span>
</nav>
