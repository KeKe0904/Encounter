<th:block th:fragment="head(pageTitle, pageDescription, pageImage, pagePath, pageType, publishedTime, modifiedTime, authorName)"
          th:with="absBase=${site.url != null and !#strings.startsWith(site.url, 'http://127.') and !#strings.startsWith(site.url, 'http://localhost') ? site.url : ''}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title th:text="${pageTitle != null and pageTitle != ''} ? ${pageTitle + ' · ' + site.title} : ${site.title}">Encounter</title>

  <!-- ============ SEO 基础 ============ -->
  <!-- description 由 Halo 内置 SEO 处理器注入（后台「SEO 设置」+ 文章摘要），此处不重复输出 -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" th:if="${pagePath != null and pagePath != ''}" th:href="@{${pagePath}}" />
  <link rel="sitemap" type="application/xml" th:title="${site.title + ' Sitemap'}" th:href="@{/sitemap.xml}" />
  <link rel="alternate" type="application/rss+xml" th:title="${site.title}" th:href="@{/rss.xml}" />

  <!-- ============ Open Graph ============ -->
  <meta property="og:site_name" th:content="${site.title}" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:type" th:content="${pageType != null and pageType != ''} ? ${pageType} : 'website'" />
  <meta property="og:title" th:content="${pageTitle != null and pageTitle != ''} ? ${pageTitle} : ${site.title}" />
  <meta property="og:description" th:if="${pageDescription != null and pageDescription != ''}" th:content="${pageDescription}" />
  <meta property="og:url" th:if="${pagePath != null and pagePath != '' and absBase != ''}" th:content="${absBase + pagePath}" />
  <meta property="og:image" th:if="${pageImage != null and pageImage != ''}"
        th:content="${#strings.startsWith(pageImage, 'http')} ? ${pageImage} : ${absBase + pageImage}" />

  <!-- ============ Twitter Card ============ -->
  <meta name="twitter:card" th:content="${pageImage != null and pageImage != ''} ? 'summary_large_image' : 'summary'" />
  <meta name="twitter:title" th:content="${pageTitle != null and pageTitle != ''} ? ${pageTitle} : ${site.title}" />
  <meta name="twitter:description" th:if="${pageDescription != null and pageDescription != ''}" th:content="${pageDescription}" />
  <meta name="twitter:image" th:if="${pageImage != null and pageImage != ''}"
        th:content="${#strings.startsWith(pageImage, 'http')} ? ${pageImage} : ${absBase + pageImage}" />

  <!-- ============ 结构化数据（仅文章） ============ -->
  <script type="application/ld+json" th:if="${pageType == 'article' and publishedTime != null and publishedTime != ''}" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": /*[[${pageTitle}]]*/ "",
      "description": /*[[${pageDescription != null ? pageDescription : ''}]]*/ "",
      "datePublished": /*[[${publishedTime}]]*/ "",
      "dateModified": /*[[${modifiedTime != null and modifiedTime != ''} ? ${modifiedTime} : ${publishedTime}]]*/ "",
      "author": {
        "@type": "Person",
        "name": /*[[${authorName != null and authorName != ''} ? ${authorName} : ${site.title}]]*/ ""
      },
      "publisher": {
        "@type": "Organization",
        "name": /*[[${site.title}]]*/ ""
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": /*[[${absBase + pagePath}]]*/ ""
      }<th:block th:if="${pageImage != null and pageImage != ''}">,
      "image": /*[[${#strings.startsWith(pageImage, 'http')} ? ${pageImage} : ${absBase + pageImage}]]*/ ""  <!-- 主题设置 → 代码注入 → 页头代码 -->
  <th:block th:if="${!#strings.isEmpty(theme.config.inject?.head_code)}">
    <th:block th:utext="${theme.config.inject.head_code}"></th:block>
  </th:block>
</th:block>
    }
  </script>

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)" />

  <script>
    // 首屏绘制前确定主题，避免闪白/黑块（对应原版 ThemeManager 的内联脚本）
    (function () {
      try {
        var s = localStorage.getItem('encounter-theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = s === 'light' || s === 'dark' ? s : (d ? 'dark' : 'light');
        var r = document.documentElement;
        r.classList.remove('light', 'dark');
        r.classList.add(t);
        r.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" th:href="@{/assets/css/fonts.css?v=13}" />
  <link rel="stylesheet" th:href="@{/assets/css/global.css?v=18}" />
  <link rel="stylesheet" th:href="@{/assets/css/post.css?v=15}" />
  <link rel="stylesheet" th:href="@{/assets/css/components.css?v=53}" />
  <link rel="stylesheet" th:href="@{/assets/css/encounter.css?v=90}" />
  <link rel="stylesheet" th:if="${theme.config.post?.katex != false}" th:href="@{/assets/css/katex.min.css?v=1}" />
  <link rel="icon" type="image/png" th:href="@{/assets/favicon-light.png}" />
  <script th:src="@{/assets/js/encounter.js?v=72}" defer></script>
  <!-- 主题设置 → 代码注入 → 页头代码 -->
  <th:block th:if="${!#strings.isEmpty(theme.config.inject?.head_code)}">
    <th:block th:utext="${theme.config.inject.head_code}"></th:block>
  </th:block>
</th:block>
