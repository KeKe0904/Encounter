<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{modules/head :: head(pageTitle='归档', pageDescription=null, pageImage=null, pagePath='/archives', pageType='website', publishedTime=null, modifiedTime=null, authorName=null)}, content = ~{::content})}">
  <th:block th:fragment="content">
        <h2 class="page-title">归档</h2>
        <section th:each="archive : ${archives.items}" class="archive-group">
          <h3 class="archive-year" th:text="${archive.year}"></h3>
          <th:block th:each="month : ${archive.months}">
            <th:block th:replace="~{modules/post-list :: postList(${month.posts})}"></th:block>
          </th:block>
        </section>
        <p class="empty-hint" th:if="${archives.items.isEmpty()}">还没有可以归档的文章。</p>
        <th:block th:replace="~{modules/pager :: pager(${archives.hasPrevious()}, ${archives.prevUrl}, ${archives.hasNext()}, ${archives.nextUrl})}"></th:block>
  </th:block>
</html>
