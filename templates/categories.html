<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{modules/head :: head(pageTitle='分类', pageDescription=null, pageImage=null, pagePath='/categories', pageType='website', publishedTime=null, modifiedTime=null, authorName=null)}, content = ~{::content})}">
  <th:block th:fragment="content">
        <h2 class="page-title">分类</h2>
        <ul class="post-list">
          <li th:each="category : ${categoryFinder.listAll()}">
            <a th:href="@{${category.status.permalink}}">
              <div class="post-item">
                <p class="title" th:text="${category.spec.displayName}"></p>
                <div class="divider"></div>
                <p class="date font-features" th:text="|${category.status.postCount} 篇|"></p>
              </div>
            </a>
          </li>
        </ul>
        <div class="placeholder"></div>
  </th:block>
</html>
