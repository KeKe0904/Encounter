<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{modules/head :: head(pageTitle='标签', pageDescription=null, pageImage=null, pagePath='/tags', pageType='website', publishedTime=null, modifiedTime=null, authorName=null)}, content = ~{::content})}">
  <th:block th:fragment="content">
        <h2 class="page-title">标签</h2>
        <ul class="post-list">
          <li th:each="tag : ${tagFinder.listAll()}">
            <a th:href="@{${tag.status.permalink}}">
              <div class="post-item">
                <p class="title" th:text="${tag.spec.displayName}"></p>
                <div class="divider"></div>
                <p class="date font-features" th:text="|${tag.status.postCount} 篇|"></p>
              </div>
            </a>
          </li>
        </ul>
        <div class="placeholder"></div>
  </th:block>
</html>
