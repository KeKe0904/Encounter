<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{post-layout :: post(head = ~{modules/head :: head(pageTitle=${post.spec.title}, pageDescription=${post.status?.excerpt ?: ''}, pageImage=${post.spec.cover ?: ''}, pagePath=${post.status.permalink}, pageType='article', publishedTime=${post.spec.publishTime != null ? #dates.formatISO(post.spec.publishTime) : ''}, modifiedTime=${post.status?.lastModifyTime != null ? #dates.formatISO(post.status.lastModifyTime) : ''}, authorName=${site.title})}, content = ~{::content})}">
  <th:block th:fragment="content">
        <div class="prose">
          <a th:href="@{/}" class="back-button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 6.5H9.5C11.1569 6.5 12.5 7.84315 12.5 9.5V9.5C12.5 11.1569 11.1569 12.5 9.5 12.5H7.5M2.5 6.5L5.5 9.5M2.5 6.5L5.5 3.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            index
          </a>
          <div class="toc-container" id="toc">
            <nav class="toc-nav">
              <ul class="toc-list" id="toc-list">
                <li class="toc-item toc-level-0">
                  <a href="#" class="toc-link toc-title" title="Back to top" data-text="Back to top"></a>
                </li>
              </ul>
            </nav>
          </div>
          <div class="title">
            <h1 th:text="${post.spec.title}"></h1>
            <div class="date"><th:block th:replace="~{modules/date :: fmt(${post.spec.publishTime})}"></th:block></div>
          </div>
          <article class="content" th:utext="${post.content.content}"></article>

          <div class="post-actions">
            <button type="button" class="like-button" data-upvote
                    data-group="content.halo.run" data-plural="posts"
                    th:attr="data-name=${post.metadata.name},data-require-login=${theme.config.halo?.like_permission == 'login'}"
                    aria-label="点赞">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 13.5S2.5 10.2 2.5 6.4A3.4 3.4 0 0 1 8 4.2a3.4 3.4 0 0 1 5.5 2.2c0 3.8-5.5 7.1-5.5 7.1Z"
                      stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path>
              </svg>
              <span class="like-text">赞</span>
              <span class="like-count" data-upvote-count th:text="${post.stats?.upvote ?: 0}">0</span>
            </button>
          </div>

          <section class="encounter-comments" th:if="${theme.config.halo?.comment_enable != false}">
            <h2 class="comment-heading">评论</h2>
            <div class="comment-gate" data-comment-gate th:if="${theme.config.halo?.comment_permission == 'login'}" hidden>
              <a th:href="@{/login}" class="comment-gate-link">登录后参与评论</a>
            </div>
            <div class="comment-widget" th:classappend="${theme.config.halo?.comment_permission == 'login'} ? 'is-auth-only'">
              <halo:comment group="content.halo.run" kind="Post" th:name="${post.metadata.name}" th:group="content.halo.run" />
            </div>
          </section>
        </div>
  </th:block>
</html>
