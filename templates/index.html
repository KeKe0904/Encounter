<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{modules/head :: head(pageTitle=null, pageDescription=${theme.config.basic?.intro != null ? #strings.replace(#strings.replace(theme.config.basic.intro, '<p>', ''), '</p>', ' ') : null}, pageImage=null, pagePath='/', pageType='website', publishedTime=null, modifiedTime=null, authorName=null)}, content = ~{::content})}">
  <th:block th:fragment="content">
        <th:block th:with="intro=${theme.config.basic?.intro}">
          <div class="about prose" th:if="${intro != null and #strings.length(intro) > 0}" th:utext="${intro}"></div>
          <div class="about prose" th:if="${(intro == null or #strings.length(intro) == 0) and #strings.length(site.description) > 0}">
            <p th:text="${site.description}"></p>
          </div>
        </th:block>
        <th:block th:replace="~{modules/post-list :: postList(${posts.items})}"></th:block>
        <p class="empty-hint" th:if="${posts.total == 0}">这里还很安静，还没有文章。</p>
        <th:block th:replace="~{modules/pager :: pager(${posts.hasPrevious()}, ${posts.prevUrl}, ${posts.hasNext()}, ${posts.nextUrl})}"></th:block>
  </th:block>
</html>
