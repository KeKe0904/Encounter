apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-encounter
spec:
  logo: https://cdn.jsdelivr.net/gh/KeKe0904/Encounter@main/logo.svg
  displayName: "Encounter"
  author:
    name: 3ASH / Halo 移植版
    website: https://github.com/the3ash/astro-chiri
  description: Encounter —— 基于 Chiri 移植到 Halo 2.27 的极简博客主题。
  homepage: https://github.com/KeKe0904/Encounter
  repo: https://github.com/KeKe0904/Encounter
  issues: https://github.com/KeKe0904/Encounter/issues
  settingName: "theme-encounter-setting"
  configMapName: "theme-encounter-configmap"
  version: 0.1.3
  requires: ">=2.27.0"
  license:
    - name: "MIT"
      url: "https://github.com/the3ash/astro-chiri/blob/main/LICENSE"
  customTemplates:
    page:
      - name: 关于页
        description: 与原版 /about 一致的关于页面
        file: page_about.html
