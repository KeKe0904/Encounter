apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-encounter-setting
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: text
          name: content_width
          label: 内容区宽度
          value: "560px"
          help: 对应原版的 --content-width / body max-width
        - $formkit: checkbox
          name: centered_layout
          label: 居中布局
          value: true
        - $formkit: checkbox
          name: theme_toggle
          label: 显示深浅色切换按钮
          value: true
          help: 显示在页头右上角，点击切换白天 / 夜间
        - $formkit: textarea
          name: intro
          label: 首页简介
          value: "这里是 Encounter，一个安静的角落。\n记录日常、读书，和一些没头没尾的想法。"
          rows: 4
          help: 显示在首页文章列表上方，支持 HTML；留空则回退到站点描述
        - $formkit: checkbox
          name: post_list_dotted_divider
          label: 列表使用点状分隔线
          value: false
        - $formkit: checkbox
          name: weather_enable
          label: 显示天气
          value: true
          help: 按访客 IP 定位显示所在城市当前温度（ipinfo.io + Open-Meteo，无需密钥）
        - $formkit: checkbox
          name: footer
          label: 显示页脚
          value: true
        - $formkit: checkbox
          name: fade_animation
          label: 启用淡入动画
          value: true
    - group: date
      label: 日期设置
      formSchema:
        - $formkit: select
          name: date_format
          label: 日期格式
          value: "YYYY-MM-DD"
          options:
            - label: YYYY-MM-DD
              value: "YYYY-MM-DD"
            - label: MM-DD-YYYY
              value: "MM-DD-YYYY"
            - label: DD-MM-YYYY
              value: "DD-MM-YYYY"
            - label: MONTH DAY YYYY
              value: "MONTH DAY YYYY"
            - label: DAY MONTH YYYY
              value: "DAY MONTH YYYY"
        - $formkit: text
          name: date_separator
          label: 日期分隔符
          value: "."
        - $formkit: checkbox
          name: date_on_right
          label: 日期在右侧
          value: true
    - group: post
      label: 文章设置
      formSchema:
        - $formkit: checkbox
          name: toc
          label: 显示目录
          value: true
        - $formkit: checkbox
          name: reading_time
          label: 显示阅读时长
          value: false
        - $formkit: checkbox
          name: image_viewer
          label: 图片查看器
          value: true
        - $formkit: checkbox
          name: copy_code
          label: 代码块复制按钮
          value: true
        - $formkit: checkbox
          name: katex
          label: 启用 KaTeX 公式
          value: true
    - group: halo
      label: Halo 能力（原版没有，按原版版式内嵌）
      formSchema:
        - $formkit: checkbox
          name: comment_enable
          label: 启用评论
          value: true
        - $formkit: select
          name: like_permission
          label: 点赞权限
          value: all
          options:
            - label: 所有人（含游客）
              value: all
            - label: 仅登录用户
              value: login
          help: 控制文章与瞬间的点赞，可与评论权限分别设置
        - $formkit: select
          name: comment_permission
          label: 评论权限
          value: all
          options:
            - label: 所有人（含游客）
              value: all
            - label: 仅登录用户
              value: login
          help: 控制文章与瞬间的评论，可与点赞权限分别设置
        - $formkit: checkbox
          name: search_enable
          label: 启用搜索入口
          value: true
    - group: beian
      label: 备案信息
      formSchema:
        - $formkit: text
          name: icp_text
          label: ICP 备案号
          value: ""
          placeholder: 如 京ICP备12345678号-1
          help: 填写后显示在页脚；留空则不显示
        - $formkit: text
          name: icp_url
          label: ICP 备案查询地址
          value: "https://beian.miit.gov.cn/"
        - $formkit: text
          name: police_text
          label: 公安联网备案号
          value: ""
          placeholder: 如 京公网安备 11010502030123号
        - $formkit: text
          name: police_code
          label: 公安备案编号（纯数字）
          value: ""
          placeholder: 如 11010502030123
          help: 用于拼接官方查询链接 webSearch?code=编号
        - $formkit: text
          name: police_icon
          label: 公安备案图标地址
          value: ""
          help: 留空则使用主题内置的官方徽标（已本地打包，避免防盗链失效）
